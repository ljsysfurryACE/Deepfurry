name: Build & Test Deepfurry

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libssl-dev libncurses-dev \
            dosfstools parted mtools grub-common grub-pc-bin grub-efi-amd64-bin \
            cpio gzip xz-utils wget curl \
            qemu-system-x86 ovmf busybox-static

      - name: 构建 + 验证
        env:
          WS: ${{ github.workspace }}
        run: |
          chmod +x ci_build.sh
          sudo -E bash ci_build.sh

      - name: 上传镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: deepfurry-v8.2
          path: deepfurry_v8.2.img

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deepfurry_v8.2.img
          generate_release_notes: true
